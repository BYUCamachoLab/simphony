[tox]
envlist = py3.9, py3.10, py3.11, py3.12

[testenv]
deps =
    numpy
    pytest
    scipy

[testenv:py3.11]

[flake8]
max-line-length = 88
max-complexity = 18
select = B,C,E,F,W,T4,B9
ignore = E203, E266, E501, W503, F403, F401, W605

exclude =
    # No need to traverse our git directory
    .git,
    # There's no value in checking cache directories
    __pycache__,
    # The conf file is mostly autogenerated, ignore it
    docs/source/conf.py,
    # The old directory contains Flake8 2.0
    old,
    # This contains our built documentation
    build,
    # This contains builds of flake8 that we don't want to check
    dist,
    env,
    .venv,
    .ipynb_checkpoints,
    .tox,
    extra,
    deprecated

per-file-ignores =
    simphony/time_domain/SSFM_old.py:E226,F841
    simphony/time_domain/examples/*.py:E203,E402
    simphony/time_domain/old_simulation.py:C901,E402,E711,F541
    simphony/time_domain/quicker_delete.py:E226,E402
    simphony/time_domain/tests/*.py:E402,F841
